<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ma Messagerie - Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-contact">

    <header>
        <h1>Ma Messagerie</h1>

        <nav>
            <a href="conversation.html">Conversations</a>
            <a href="contact.html">Contacts</a>
            <a href="parametre.html">Paramètres</a>
        </nav>
    </header>

    <main>

         <div class="contacts-conteneur">

        <h2>Contacts</h2>

        <div class="actions-contacts">
        <!-- Recherche d'un contact -->
        <section>
            <h3>Rechercher un contact</h3>

            <form>
                <label for="recherche">Rechercher :</label>
                <input
                    type="search"
                    id="recherche"
                    name="recherche"
                    placeholder="Nom du contact"
                >

                <button type="submit">Rechercher</button>
            </form>
        </section>

        <!-- Invitation d'un nouveau contact -->
        <section>
            <h3>Ajouter un contact</h3>

            <form>
                <label for="nouveau-contact">Nom du contact :</label>
                <input
                    type="text"
                    id="nouveau-contact"
                    name="nouveau-contact"
                    required
                >

                <button type="submit">Inviter</button>
            </form>
        </section>
</div>
        <!-- Invitations reçues -->
<section class="invitations-recues">
    <h3>Invitations reçues</h3>

    <ul>
        <li>
            <div class="contact-identite">
                <span class="avatar">S</span>
                <span>Sarah</span>
            </div>

            <div class="actions-invitation">
                <button type="button" class="accepter">Accepter</button>
                <button type="button" class="refuser">Refuser</button>
            </div>
        </li>
    </ul>
</section>

        <!-- Invitations envoyées -->
<section class="invitations-envoyees">
    <h3>Invitations envoyées</h3>

    <ul>
        <li>
            <div class="contact-identite">
                <span class="avatar">T</span>
                <span>Thomas</span>
            </div>

            <span class="statut-attente">En attente</span>
        </li>
    </ul>
</section>

        <!-- Liste des contacts -->
<section class="mes-contacts">
    <h3>Mes contacts</h3>

    <ul>
        <li>
            <div class="contact-identite">
                <span class="avatar">A</span>
                <span>Alex</span>
            </div>

            <a href="conversation.html" class="bouton-message">
                Message
            </a>
        </li>

        <li>
            <div class="contact-identite">
                <span class="avatar">M</span>
                <span>Marie</span>
            </div>

            <a href="conversation.html" class="bouton-message">
                Message
            </a>
        </li>
    </ul>
</section>

    </div>
</main>

</body>

</html>
