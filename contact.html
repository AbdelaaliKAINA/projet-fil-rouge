<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Couleur de la barre du navigateur sur téléphone -->
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Ma Messagerie : gestion des contacts et des invitations.">
    <title>Ma Messagerie - Contacts</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <!-- Thème appliqué avant l'affichage (sans defer) -->
    <script src="js/theme.js"></script>
</head>

<body class="page-contact">

    <!-- Lien d'évitement : accès direct au contenu au clavier -->
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <!-- En-tête et navigation -->
    <header class="entete">
        <h1 class="logo">
            <a href="conversation.html">
                <span class="logo-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/><circle cx="8" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="12" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="16" cy="11.5" r="1.3" fill="#2563eb"/></svg></span>
                Ma Messagerie
            </a>
        </h1>

        <nav aria-label="Navigation principale">
            <a href="conversation.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Conversations
            </a>
            <a href="salons.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
                Salons
            </a>
            <a href="contact.html" aria-current="page">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Contacts
            </a>
            <a href="parametre.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Paramètres
            </a>
        </nav>
    </header>

    <main id="contenu" class="carte carte-large">

        <h2>Contacts</h2>

        <div class="actions-contacts">

            <!-- Recherche parmi les contacts et invitations -->
            <section class="bloc" aria-labelledby="titre-recherche">
                <h3 id="titre-recherche">Rechercher un contact</h3>

                <form id="form-recherche" role="search">
                    <label for="recherche">Nom ou courriel :</label>
                    <input type="search" id="recherche" name="recherche"
                           placeholder="Ex. : Marie" autocomplete="off">
                    <button type="submit" class="bouton bouton-principal">Rechercher</button>
                </form>

                <!-- Résultats annoncés aux lecteurs d'écran -->
                <div id="resultat-recherche" class="resultat-recherche" aria-live="polite"></div>
            </section>

            <!-- Envoi d'une invitation à un compte existant -->
            <section class="bloc" aria-labelledby="titre-invitation">
                <h3 id="titre-invitation">Ajouter un contact</h3>

                <form id="form-invitation" novalidate>
                    <label for="courriel-contact">Courriel de la personne :</label>
                    <input type="email" id="courriel-contact" name="courriel-contact"
                           placeholder="nom@exemple.com" autocomplete="off" required>
                    <button type="submit" class="bouton bouton-principal">Inviter</button>
                </form>

                <p id="message-invitation" class="message-info" role="status"></p>

                <!-- Mon courriel, à donner à mes amis pour qu'ils m'invitent -->
                <p class="message-info">
                    Votre courriel : <strong id="mon-courriel"></strong>
                    <button type="button" id="bouton-copier-courriel" class="bouton-lien">Copier</button>
                </p>
            </section>

        </div>

        <!-- Invitations reçues : accepter ou refuser -->
        <section class="liste-section" aria-labelledby="titre-recues">
            <h3 id="titre-recues">Invitations reçues</h3>
            <ul id="liste-invitations-recues" class="liste-personnes"></ul>
        </section>

        <!-- Invitations envoyées : en attente de réponse -->
        <section class="liste-section" aria-labelledby="titre-envoyees">
            <h3 id="titre-envoyees">Invitations envoyées</h3>
            <ul id="liste-invitations-envoyees" class="liste-personnes"></ul>
        </section>

        <!-- Contacts acceptés -->
        <section class="liste-section" aria-labelledby="titre-mes-contacts">
            <h3 id="titre-mes-contacts">Mes contacts</h3>
            <ul id="liste-mes-contacts" class="liste-personnes"></ul>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
