<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ma Messagerie - Conversations</title>
</head>

<body>

    <header>
        <h1>Ma Messagerie</h1>

        <nav>
            <a href="conversation.html">Conversations</a>
            <a href="contact.html">Contacts</a>
            <a href="parametre.html">Paramètres</a>
        </nav>
    </header>

    <main>

        <!-- Liste des conversations -->
        <aside>
            <h2>Conversations</h2>

            <button type="button">Nouvelle conversation</button>

            <ul>
                <li>
                    <a href="#">Alex</a>
                </li>
                <li>
                    <a href="#">Sarah</a>
                </li>
                <li>
                    <a href="#">Thomas</a>
                </li>
            </ul>
        </aside>

        <!-- Conversation actuellement ouverte -->
        <section>

            <header>
                <h2>Alex</h2>
                <p>En ligne</p>
            </header>

            <!-- Liste des messages -->
            <section>
                <h3>Messages</h3>

                <article>
                    <p>
                        <strong>Alex</strong>
                        <time datetime="2026-09-25T14:31">14:31</time>
                    </p>

                    <p>Salut ! Tu viens au cours demain ?</p>

                    <!-- Fonctionnalité supplémentaire : réactions -->
                    <div>
                        <button type="button">👍</button>
                        <button type="button">❤️</button>
                        <button type="button">😂</button>
                    </div>
                </article>

                <article>
                    <p>
                        <strong>Moi</strong>
                        <time datetime="2026-09-25T14:32">14:32</time>
                    </p>

                    <p>Oui, je serai là !</p>

                    <div>
                        <button type="button">👍</button>
                        <button type="button">❤️</button>
                        <button type="button">😂</button>
                    </div>
                </article>

            </section>

            <!-- Formulaire d'envoi d'un message -->
            <form>
                <label for="message">Message :</label>

                <input
                    type="text"
                    id="message"
                    name="message"
                    placeholder="Écrire un message..."
                    required
                >

                <button type="submit">Envoyer</button>
            </form>

        </section>

    </main>

</body>

</html>
