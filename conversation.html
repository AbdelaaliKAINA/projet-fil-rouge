<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ma Messagerie : vos conversations en temps réel.">
    <title>Ma Messagerie - Conversations</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-conversation">

    <!-- Lien d\'évitement : accès direct au contenu au clavier -->
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <!-- En-tête et navigation (identiques sur toutes les pages) -->
    <header class="entete">
        <h1 class="logo">
            <a href="conversation.html">
                <span class="logo-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/><circle cx="8" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="12" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="16" cy="11.5" r="1.3" fill="#2563eb"/></svg></span>
                Ma Messagerie
            </a>
        </h1>

        <nav aria-label="Navigation principale">
            <a href="conversation.html" aria-current="page">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Conversations
            </a>
            <a href="contact.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Contacts
            </a>
            <a href="parametre.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Paramètres
            </a>
        </nav>
    </header>

    <main id="contenu" class="messagerie">

        <!-- Colonne de gauche : liste des conversations -->
        <aside class="liste-conversations" aria-labelledby="titre-conversations">
            <h2 id="titre-conversations">Conversations</h2>

            <!-- Démarrer une conversation avec un contact accepté -->
            <form id="form-nouvelle-conversation" class="nouvelle-conversation">
                <label for="choix-contact">Nouvelle conversation :</label>
                <select id="choix-contact" name="contact" required>
                    <option value="">Chargement...</option>
                </select>
                <button type="submit" id="bouton-ouvrir" class="bouton bouton-principal">Ouvrir</button>

                <!-- Affiché quand aucun contact n'est disponible -->
                <p id="aide-nouvelle-conversation" class="message-info" hidden>
                    Aucun nouveau contact.
                    <a href="contact.html">Ajouter un contact</a>
                </p>
            </form>

            <!-- Rempli par js/conversation.js -->
            <ul id="liste-conversations"></ul>
        </aside>

        <!-- Colonne de droite : conversation ouverte -->
        <section class="conversation" aria-labelledby="nom-contact">

            <header class="profil-conversation">
                <span class="avatar" id="avatar-contact" aria-hidden="true">?</span>
                <div>
                    <h2 id="nom-contact">Aucune conversation</h2>
                    <!-- Indicateur en ligne / hors ligne (Supabase Presence) -->
                    <p id="statut-contact" class="statut hors-ligne" hidden>
                        <span class="point-statut"></span>
                        <span id="texte-statut">Hors ligne</span>
                    </p>
                </div>
            </header>

            <!-- Liste des messages, dans l'ordre chronologique -->
            <ol id="liste-messages" class="liste-messages" aria-live="polite"></ol>

            <!-- Bouton affiché quand on remonte dans l'historique -->
            <button type="button" id="bouton-descendre" class="bouton-descendre"
                    aria-label="Descendre au dernier message" hidden>↓</button>

            <!-- Formulaire d'envoi d'un message -->
            <form id="form-message" class="form-message" hidden>
                <label for="message" class="visuellement-cache">Message :</label>
                <input type="text" id="message" name="message"
                       placeholder="Écrire un message..." autocomplete="off"
                       maxlength="1000" required>
                <!-- Nombre de caractères saisis (maximum 1000) -->
                <span id="compteur-message" class="compteur">0 / 1000</span>
                <button type="submit" class="bouton bouton-principal">Envoyer</button>
            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/conversation.js"></script>
</body>

</html>
