<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ma Messagerie - Conversations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-conversation">

    <header>
        <h1>Ma Messagerie</h1>

        <nav>
            <a href="conversation.html">Conversations</a>
            <a href="contact.html">Contacts</a>
            <a href="parametre.html">Paramètres</a>
        </nav>
    </header>

    <main>

        <!-- Liste des conversations -->
        <aside>
            <h2>Conversations</h2>

            <button type="button">Nouvelle conversation</button>

            <ul>
                <li>
                    <a href="#" class="active">
                        <span class="avatar">A</span>
                        <span>Alex</span>
                    </a>
                </li>
                <li>
    <a href="#">
        <span class="avatar">S</span>
        <span>Sarah</span>
    </a>
</li>

<li>
    <a href="#">
        <span class="avatar">T</span>
        <span>Thomas</span>
    </a>
</li>
            </ul>
        </aside>

        <!-- Conversation actuellement ouverte -->
        <section>

            <header>
    <div class="profil-conversation">
        <span class="avatar">A</span>

        <div>
            <h2>Alex</h2>
            <p class="statut-en-ligne">
                <span class="point-en-ligne"></span>
                En ligne
            </p>
        </div>
    </div>
</header>

            <!-- Liste des messages -->
            <section>
                <h3>Messages</h3>

                <article>
                    <p>
                        <strong>Alex</strong>
                        <time datetime="2026-09-25T14:31">14:31</time>
                    </p>

                    <p>Salut ! Tu viens au cours demain ?</p>

                    <!-- Fonctionnalité supplémentaire : réactions -->
                    <div>
                        <button type="button">👍</button>
                        <button type="button">❤️</button>
                        <button type="button">😂</button>
                    </div>
                </article>

                <article class="message-moi">
                    <p>
                        <strong>Moi</strong>
                        <time datetime="2026-09-25T14:32">14:32</time>
                    </p>

                    <p>Oui, je serai là !</p>

                    <div>
                        <button type="button">👍</button>
                        <button type="button">❤️</button>
                        <button type="button">😂</button>
                    </div>
                </article>

            </section>

            <!-- Formulaire d'envoi d'un message -->
            <form>
                <label for="message">Message :</label>

                <input
                    type="text"
                    id="message"
                    name="message"
                    placeholder="Écrire un message..."
                    required
                >

                <button type="submit">Envoyer</button>
            </form>

        </section>

    </main>

</body>

</html>
