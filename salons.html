<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Couleur de la barre du navigateur sur téléphone -->
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Ma Messagerie : salons de discussion de groupe.">
    <title>Ma Messagerie - Salons</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-salons">

    <!-- Lien d'évitement : accès direct au contenu au clavier -->
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <!-- En-tête et navigation (identiques sur toutes les pages) -->
    <header class="entete">
        <h1 class="logo">
            <a href="conversation.html">
                <span class="logo-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/><circle cx="8" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="12" cy="11.5" r="1.3" fill="#2563eb"/><circle cx="16" cy="11.5" r="1.3" fill="#2563eb"/></svg></span>
                Ma Messagerie
            </a>
        </h1>

        <nav aria-label="Navigation principale">
            <a href="conversation.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Conversations
            </a>
            <a href="salons.html" aria-current="page">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
                Salons
            </a>
            <a href="contact.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Contacts
            </a>
            <a href="parametre.html">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Paramètres
            </a>
        </nav>
    </header>

    <main id="contenu" class="messagerie">

        <!-- Colonne de gauche : liste des salons -->
        <aside class="liste-conversations" aria-labelledby="titre-salons">
            <h2 id="titre-salons">Salons</h2>
            <p class="bienvenue">Discussions de groupe ouvertes à toutes les personnes inscrites.</p>

            <!-- Création d'un salon -->
            <form id="form-salon" class="nouvelle-conversation" novalidate>
                <label for="nom-salon">Nouveau salon :</label>
                <input type="text" id="nom-salon" name="nom-salon" placeholder="Ex. : Général"
                       maxlength="50" autocomplete="off" required>
                <button type="submit" class="bouton bouton-principal">Créer le salon</button>
                <p id="erreur-salon" class="message-erreur" role="alert"></p>
            </form>

            <!-- Rempli par js/salons.js -->
            <ul id="liste-salons" class="liste-salons"></ul>
        </aside>

        <!-- Colonne de droite : salon ouvert -->
        <section class="conversation" aria-labelledby="nom-salon-ouvert">

            <header class="profil-conversation">
                <!-- Retour à la liste (visible seulement sur téléphone) -->
                <button type="button" id="bouton-retour" class="bouton-retour"
                        aria-label="Retour à la liste des salons">←</button>
                <span class="avatar avatar-salon" aria-hidden="true">#</span>
                <div>
                    <h2 id="nom-salon-ouvert">Aucun salon ouvert</h2>
                    <p class="info-salon">Salon public</p>
                </div>
                <!-- Visible seulement pour la personne qui a créé le salon -->
                <button type="button" id="bouton-supprimer-salon"
                        class="bouton bouton-danger bouton-supprimer-salon" hidden>Supprimer le salon</button>
            </header>

            <!-- Messages du salon, dans l'ordre chronologique -->
            <ol id="liste-messages" class="liste-messages" aria-live="polite">
                <li class="message-vide">Choisissez un salon ou créez-en un.</li>
            </ol>

            <!-- Formulaire d'envoi d'un message dans le salon -->
            <form id="form-message" class="form-message" hidden>
                <label for="message" class="visuellement-cache">Message :</label>
                <input type="text" id="message" name="message"
                       placeholder="Écrire dans le salon..." autocomplete="off"
                       maxlength="1000" required>
                <button type="submit" class="bouton bouton-principal">Envoyer</button>
            </form>
            <p id="erreur-message" class="message-erreur erreur-envoi" role="alert"></p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/salons.js"></script>
</body>

</html>
